<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>AKAB - Centre technique</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <div id="stage">
    <header>
      <img class="logo" src="assets/akab-logo.svg" alt="AKAB" draggable="false">
      <div class="title">Centre technique</div>
      <div class="spacer"></div>
      <div id="offline" hidden>Hors ligne</div>
      <div class="clock"><div id="time">--:--</div><div id="date"></div></div>
    </header>
    <section id="top">
      <div class="hero" id="hero"></div>
      <div class="side" id="side"></div>
    </section>
    <main>
      <section class="panel" id="p-tickets"></section>
      <div class="col" id="col-b">
        <section class="panel" id="p-techs"></section>
        <section class="panel" id="p-projects"></section>
      </div>
      <div class="col" id="col-c">
        <section class="panel" id="p-rmm"></section>
        <section class="panel" id="p-unifi"></section>
        <section class="panel" id="p-trend"></section>
      </div>
    </main>
  </div>
</div>
<div id="rest" hidden></div>
<script src="app.js"></script>
</body>
</html>
