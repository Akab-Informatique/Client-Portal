<style>
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);font-family:"Instrument Sans",system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque Variable","Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
.mut{color:var(--muted-foreground)}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh;background:radial-gradient(900px 400px at 85% -10%,rgba(245,148,16,.10),transparent 60%),var(--background)}
aside{border-right:1px solid var(--glass-border);background:rgba(255,255,255,.02);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}
.bars{display:flex;gap:3px;align-items:flex-end;height:20px}.bars i{width:5px;background:var(--grad-gold);border-radius:2px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--muted-foreground)}
.nav.on{background:rgba(255,206,26,.10);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(255,206,26,.25)}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground);opacity:.6;padding:14px 10px 4px}
.ic{width:16px;height:16px;border-radius:5px;border:1.5px solid currentColor;opacity:.8}
main{padding:20px 24px 40px;min-width:0;transition:.2s}
body.open main{margin-right:500px}
@media(max-width:1300px){body.open main{margin-right:0}}
.glass{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;box-shadow:var(--glass-shadow);backdrop-filter:blur(14px)}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:10px;border:1px solid var(--glass-border);background:var(--glass-bg);color:var(--foreground);font:inherit;cursor:pointer;white-space:nowrap}
.btn.gold{background:var(--grad-gold);color:#1a1204;border:0;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
/* fleet strip */
.strip{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{padding:12px 14px;cursor:pointer}
.tile.on{border-color:rgba(255,206,26,.55);box-shadow:0 0 24px -12px rgba(255,206,26,.5)}
.tile .n{font-size:26px;font-weight:600;line-height:1.1}.tile .l{font-size:12px;color:var(--muted-foreground)}
.fleet{display:flex;gap:14px;align-items:center;padding:10px 14px}
.ring{--v:78;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--v)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center;flex:none}
.ring b{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:17px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:200px;height:34px;border-radius:10px;border:1px solid var(--glass-border);background:var(--glass-bg);color:var(--foreground);padding:0 12px;font:inherit}
.seg{display:inline-flex;padding:3px;border-radius:11px;border:1px solid var(--glass-border);background:var(--glass-bg)}
.seg button{border:0;background:transparent;color:var(--muted-foreground);font:inherit;padding:5px 11px;border-radius:8px;cursor:pointer}
.seg button.on{background:rgba(255,206,26,.14);color:var(--gold)}
/* grouped by client */
.grp{display:flex;align-items:center;gap:10px;margin:14px 2px 6px}
.grp b{font-family:"Bricolage Grotesque Variable",sans-serif;font-size:15px}
.grp .pt{margin-left:auto;font-size:12px;color:var(--muted-foreground)}
.head,.row{display:grid;grid-template-columns:minmax(170px,1.1fr) minmax(130px,.8fr) minmax(210px,1.5fr) minmax(140px,.9fr) 112px 60px;gap:12px;align-items:center;padding:0 14px}
.head{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-foreground);padding-bottom:2px}
.row{height:62px;cursor:pointer;position:relative;margin-bottom:7px;transition:.15s}
.row:hover{border-color:rgba(255,206,26,.35)}
.row.sel{border-color:rgba(255,206,26,.6);background:rgba(255,206,26,.05)}
.dev{display:flex;align-items:center;gap:11px;min-width:0}
.score{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;background:conic-gradient(var(--c) calc(var(--v)*1%),rgba(255,255,255,.08) 0)}
.score i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo{display:flex;gap:5px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--glass-border);white-space:nowrap}
.chip.gr{color:#34d399;border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
.chip.am{color:#fbbf24;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.chip.rd{color:#f87171;border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.10)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}.g{background:#34d399}.r{background:#f87171}.o{background:#fbbf24}.z{background:#6b7280}
.chev{color:var(--muted-foreground);margin-right:2px}.srcs{display:flex;gap:4px;justify-content:flex-end}
.s{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700}
.s.d{background:rgba(125,211,252,.12);color:#7dd3fc;border:1px solid rgba(125,211,252,.35)}
.s.a{background:var(--grad-gold);color:#1a1204}
.s.off{background:transparent;color:#4b5563;border:1px dashed #4b5563}
/* drawer */
.drawer{position:fixed;right:0;top:0;bottom:0;width:500px;max-width:96vw;background:var(--glass-bg-strong);border-left:1px solid var(--glass-border);backdrop-filter:blur(22px);box-shadow:-30px 0 60px -30px rgba(0,0,0,.8);display:flex;flex-direction:column;z-index:10}
.dh{padding:16px 20px 12px;border-bottom:1px solid var(--glass-border)}
.tabs{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid var(--glass-border);overflow:auto}
.tabs button{border:0;background:transparent;color:var(--muted-foreground);font:inherit;padding:6px 11px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:rgba(255,206,26,.12);color:var(--gold)}
.db{padding:16px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.card{padding:13px 15px}
.card h3{margin:0 0 9px;font-size:12px;color:var(--muted-foreground);font-weight:500;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between}
.kv{display:grid;grid-template-columns:130px 1fr auto;gap:7px 10px;align-items:center}.kv .k{color:var(--muted-foreground)}
.fix{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--glass-border)}.fix:last-child{border:0}
.fix .t{flex:1}.fix .t small{display:block;color:var(--muted-foreground)}
.act{display:flex;gap:8px;flex-wrap:wrap}
.gauge{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}.gauge i{display:block;height:100%;background:var(--grad-gold)}
.tl{border-left:1px solid var(--glass-border);margin-left:5px;padding-left:14px}.tl div{position:relative;padding:5px 0}.tl div:before{content:"";position:absolute;left:-19px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.conf{border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.07);border-radius:12px;padding:10px 12px;color:#fbbf24}
.demo{position:fixed;left:232px;bottom:12px;font-size:11px;color:var(--muted-foreground);background:var(--glass-bg-strong);border:1px solid var(--glass-border);padding:4px 10px;border-radius:8px;z-index:5}
@media(max-width:1250px){.head,.row{grid-template-columns:minmax(150px,1fr) minmax(110px,.8fr) minmax(190px,1.4fr) 62px}.head>:nth-child(4),.row>:nth-child(4),.head>:nth-child(5),.row>:nth-child(5){display:none}.strip{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

];
let filt="all",sel=null,tab="rs",group=true;const closed=new Set(["Garage Lemay"]);
const col=s=>s>=80?"#34d399":s>=60?"#fbbf24":"#f87171";
const srcs=s=>`<span class="s ${s[0]=="d"||s[1]=="a"&&s[0]=="d"?"d":s[0]=="d"?"d":"off"}">D</span>`;
const badge=s=>`<span class="s ${s.includes("d")?"d":"off"}" title="Datto RMM">D</span><span class="s ${s.includes("a")?"a":"off"}" title="Agent AKAB">A</span>`;
const L={d:"Datto",a:"Agent"};
const tag=x=>`<span class="s ${x=="d"?"d":"a"}" title="${x=="d"?"Datto RMM":"Agent AKAB"}">${x=="d"?"D":"A"}</span>`;
function vis(d){if(filt=="act")return d.todo.some(t=>t[0]=="rd");if(filt=="on")return d.on;if(filt=="off")return !d.on;if(filt=="one")return d.src.replace("-","").length==1;if(filt=="eol")return d.os.includes("Windows 10");return 1}
function strip(){
 const T=[["act","À traiter",2,"#f87171"],["off","Hors ligne",1,"#fbbf24"],["one","Une seule source",2,"#fbbf24"],["eol","Fin de support",1,"#fbbf24"]];
 document.getElementById("strip").innerHTML=`<div class="glass fleet"><div class="ring" style="--v:62"><b class="disp">62</b></div><div><div style="font-weight:600">Santé du parc</div><div class="mut" style="font-size:12px">4 appareils · 2 ont besoin d'une action</div></div></div>`+T.map(t=>`<div class="glass tile ${filt==t[0]?"on":""}" onclick="filt=filt=='${t[0]}'?'all':'${t[0]}';draw()"><div class="n" style="color:${t[3]}">${t[2]}</div><div class="l">${t[1]}</div></div>`).join("");
 document.getElementById("seg").innerHTML=[["all","Tous"],["on","En ligne"],["off","Hors ligne"]].map(s=>`<button class="${(filt==s[0]||(s[0]=="all"&&!["on","off"].includes(filt)))?"on":""}" onclick="filt='${s[0]}';draw()">${s[1]}</button>`).join("");
}
function row(d){return `<div class="glass row ${sel===d.id?"sel":""}" onclick="sel=${d.id};tab='rs';draw()">
 <div class="dev"><div class="score" style="--v:${d.score};--c:${col(d.score)}"><i>${d.score}</i></div><div style="min-width:0"><div class="nm">${d.n}</div><div class="sub">${d.type}${group?"":" · "+d.c}</div></div></div>
 <div><div class="nm" style="font-weight:500">${d.lu}</div><div class="sub">${d.lt}</div></div>
 <div class="todo">${d.todo.map(t=>`<span class="chip ${t[0]}">${t[1]}</span>`).join("")}</div>
 <div><div class="nm" style="font-weight:500">${d.os}</div><div class="sub">${d.age}</div></div>
 <div class="sub"><span class="dot ${d.on?"g":"z"}"></span> ${d.on?"il y a ":"il y a "}${d.seen}<div style="margin-left:13px">${d.ip}</div></div>
 <div class="srcs">${badge(d.src)}</div></div>`}
function tog(c){closed.has(c)?closed.delete(c):closed.add(c);draw()}
function all(open){open?closed.clear():DEV.forEach(d=>closed.add(d.c));draw()}
function draw(){
 strip();
 const rows=DEV.filter(vis).sort((a,b)=>a.score-b.score);
 let h="";
 if(group){const by={};rows.forEach(d=>(by[d.c]=by[d.c]||[]).push(d));
  for(const c in by){const avg=Math.round(by[c].reduce((n,d)=>n+d.score,0)/by[c].length);h+=`<div class="grp" style="cursor:pointer" onclick="tog('${c}')"><span class="chev" style="display:inline-block;transition:.15s;${closed.has(c)?"transform:rotate(-90deg)":""}">▾</span><b>${c}</b><span class="chip ${avg>=80?"gr":avg>=60?"am":"rd"}">Santé ${avg}</span><span class="pt">${by[c].length} appareil(s)</span></div>`+(closed.has(c)?"":by[c].map(row).join(""))}}
 else h=rows.map(row).join("");
 document.getElementById("list").innerHTML=h;drawer();
}

 if(tab=="sec"){b=`<div class="glass card"><h3>Contrôles de sécurité</h3><div class="kv">${d.sec.map(r=>`<span class="k">${r[0]}</span><span><span class="chip ${r[2]}">${r[1]}</span></span>${tag(r[3])}`).join("")}</div></div>`}
 if(tab=="sw"){b=`<div class="glass card"><h3>Logiciels <span>${d.swn} installés</span></h3>${d.sw.length?d.sw.map(s=>`<div class="fix"><div class="t">${s}</div></div>`).join(""):'<div class="mut">Aucun inventaire : l\'agent AKAB n\'est pas installé.</div>'}</div>`}

${d.n}
${P}Get-Service Spooler | Select Status

Status
