# AKAB Portal — production stack for Debian 12/13 (and any Docker host)
#
# First install:
#   cp .env.example .env
#   # set POSTGRES_PASSWORD=...
#   docker compose up -d --build
#
# Upgrade (keeps data):
#   git pull origin master
#   docker compose up -d --build
#
# NEVER: docker compose down -v   ← deletes the database volume

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-akab}
      POSTGRES_USER: ${POSTGRES_USER:-akab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # Localhost only — app reaches db via Docker network name "db"
    ports:
      - "${POSTGRES_PUBLISH_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - akab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - akab

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    # Mount raw .env so the Node server can re-read Autotask/Microsoft secrets
    # WITHOUT Docker Compose $ expansion. Secrets often contain $ and #.
    # In .env use SINGLE quotes: AUTOTASK_SECRET='AbC$123#xyz'
    volumes:
      - ./.env:/app/.env:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # Discrete connection — app never builds a fragile DATABASE_URL
      # These override env_file for DB host so the app always reaches the compose db service.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-akab}
      POSTGRES_USER: ${POSTGRES_USER:-akab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_CONNECT_TIMEOUT_MS: "4000"
      PG_QUERY_TIMEOUT_MS: "12000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "4", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - akab

volumes:
  akab_pgdata:
    name: akab_pgdata

networks:
  akab:
    name: akab_net
