# AKAB Portal — production stack: app (port 3000) + PostgreSQL 16
#   cp .env.example .env    # fill the REQUIRED block
#   docker compose up -d --build
# Data lives in the volume akab_pgdata — NEVER run `docker compose down -v`.

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-akab}
      POSTGRES_USER: ${POSTGRES_USER:-akab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - akab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      # Your HTTPS reverse proxy forwards to http://<server IP>:3000
      - "${APP_PUBLISH:-3000}:3000"

volumes:
  akab_pgdata:
